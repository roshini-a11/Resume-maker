<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Resume</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="form-container">

    <h1>Create Your Resume</h1>

    <p class="form-subtitle">
        Enter your details to generate a professional resume
    </p>

    <form action="{{ url_for('generate') }}"
          method="POST">


        <!-- PERSONAL DETAILS -->

        <h2>Personal Details</h2>


        <div class="input-row">

            <div class="input-group">

                <label>Full Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required>

            </div>


            <div class="input-group">

                <label>Phone Number</label>

                <input
                    type="tel"
                    name="phone"
                    placeholder="Enter your phone number"
                    required>

            </div>

        </div>


        <div class="input-row">

            <div class="input-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="input-group">

                <label>LinkedIn Profile</label>

                <input
                    type="text"
                    name="linkedin"
                    placeholder="Enter your LinkedIn link">

            </div>

        </div>


        <div class="input-group">

            <label>Address</label>

            <input
                type="text"
                name="address"
                placeholder="Enter your address">

        </div>


        <!-- ABOUT -->

        <h2>About</h2>

        <div class="input-group">

            <label>Career Objective</label>

            <textarea
                name="about"
                placeholder="Write a short career objective"
                required></textarea>

        </div>


        <!-- EDUCATION -->

        <h2>Education</h2>

        <div class="input-group">

            <label>Education Details</label>

            <textarea
                name="education"
                placeholder="Example: B.Tech in Artificial Intelligence and Data Science"
                required></textarea>

        </div>


        <!-- SKILLS -->

        <h2>Skills</h2>

        <div class="input-group">

            <label>Technical and Soft Skills</label>

            <textarea
                name="skills"
                placeholder="Example: Python, Java, HTML, CSS, Communication"
                required></textarea>

        </div>


        <!-- EXPERIENCE -->

        <h2>Experience</h2>

        <div class="input-group">

            <label>Experience Details</label>

            <textarea
                name="experience"
                placeholder="Example: Fresher or internship details"
                required></textarea>

        </div>


        <!-- PROJECTS -->

        <h2>Projects</h2>

        <div class="input-group">

            <label>Project Details</label>

            <textarea
                name="projects"
                placeholder="Enter your project name and description"
                required></textarea>

        </div>


        <!-- CERTIFICATES -->

        <h2>Certificates</h2>

        <div class="input-group">

            <label>Certificate Details</label>

            <textarea
                name="certificates"
                placeholder="Enter your certificates"
                required></textarea>

        </div>


        <!-- DECLARATION -->

        <h2>Declaration</h2>

        <div class="input-group">

            <label>Declaration</label>

            <textarea
                name="declaration"
                placeholder="Enter your declaration"
                required></textarea>

        </div>


        <!-- BUTTONS -->

        <div class="form-buttons">

            <a href="{{ url_for('dashboard') }}"
               class="form-back-button">

                ← Back

            </a>


            <button
                type="submit"
                class="generate-button">

                Generate Resume

            </button>

        </div>

    </form>

</div>

</body>

</html>
