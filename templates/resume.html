<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ name }} - Resume</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="resume-page">

    <!-- HEADER -->

    <header class="resume-header">

        <h1>{{ name }}</h1>

        <div class="contact-details">

            <span>{{ phone }}</span>

            <span>|</span>

            <span>{{ email }}</span>

        </div>

        <div class="contact-details">

            <span>{{ linkedin }}</span>

            <span>|</span>

            <span>{{ address }}</span>

        </div>

    </header>

    <!-- ABOUT -->

    <section>

        <h2>ABOUT</h2>

        <p>{{ about }}</p>

    </section>

    <!-- EDUCATION -->

    <section>

        <h2>EDUCATION</h2>

        <p>{{ education }}</p>

    </section>

    <!-- SKILLS -->

    <section>

        <h2>SKILLS</h2>

        <p>{{ skills }}</p>

    </section>

    <!-- EXPERIENCE -->

    <section>

        <h2>EXPERIENCE</h2>

        <p>{{ experience }}</p>

    </section>

    <!-- PROJECTS -->

    <section>

        <h2>PROJECTS</h2>

        <p>{{ projects }}</p>

    </section>

    <!-- CERTIFICATES -->

    <section>

        <h2>CERTIFICATES</h2>

        <p>{{ certificates }}</p>

    </section>

    <!-- DECLARATION -->

    <section>

        <h2>DECLARATION</h2>

        <p>{{ declaration }}</p>

    </section>

    <!-- BUTTONS -->

    <div class="resume-buttons">

        <button
            type="button"
            onclick="window.print()"
            class="download-button">

            📄 Download Resume

        </button>

        <a href="{{ url_for('dashboard') }}"
           class="back-button">

            ← Back to Dashboard

        </a>

        <a href="{{ url_for('edit_resume', resume_id=1) }}"
           class="edit-button">

            ✏ Edit Resume

        </a>

    </div>

</div>

</body>

</html>
